version: '3.8'

services:
  postgres_dev:
    image: postgres:16-alpine
    container_name: postgres_dev
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data

  api_dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: api_dev
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
      - ./uploads:/app/uploads
    healthcheck:
      
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s   
      timeout: 5s      
      retries: 3      
      start_period: 5s 

    depends_on:
      - postgres_dev

volumes:
  pgdata_dev: